# Calibrator definitions for MiriDeepSpec.standard_model() and get_rsrf().
#
# RSRF filenames are versioned independently from mirideep.__version__ (see
# core.py header); do not assume rsrf_file version matches the package version.
#
# type: asteroid
#   Model = BlackBody(temp_k) * scale, multiplied by the shared tabulated
#   emissivity spectrum (rsrfs/emissivity.dat).
# type: star
#   Model = tabulated flux from model_file, smoothed and flux-converted using
#   this entry's own conversion constants.

calibrators:

  # --- Asteroid standards (BlackBody model x shared emissivity spectrum) ---
  jena2:
    type: asteroid
    temp_k: 204
    scale: 1.16e+9
    rsrf_file: jena2_rsrf_9.5.npz

  athalia:
    type: asteroid
    temp_k: 194
    scale: 5.6e+8
    rsrf_file: athalia_rsrf_9.5.npz

  athalia2:
    type: asteroid
    temp_k: 206
    scale: 8.50e+8
    rsrf_file: athalia2_rsrf_9.5.npz

  athalia3:
    type: asteroid
    temp_k: 231
    scale: 10.3e+8
    rsrf_file: athalia3_rsrf_9.5.npz

  # --- Star standards (tabulated model spectrum file) ---
  hd163466_0823:
    type: star
    model_file: hd163466_mod_003.fits
    flux_scale: 3.34e+4
    smooth_kernel_width: 100
    vshift_km_s: 0
    rsrf_file_ch1: hd163466_0823_rsrf_9.5.npz

  hd163466_0723:
    type: star
    model_file: hd163466_mod_003.fits
    flux_scale: 3.34e+4
    smooth_kernel_width: 100
    vshift_km_s: 0
    rsrf_file_ch1: hd163466_0723_rsrf_9.5.npz

  hd163466_0624:
    type: star
    model_file: hd163466_mod_003.fits
    flux_scale: 3.34e+4
    smooth_kernel_width: 100
    vshift_km_s: 0
    rsrf_file_ch1: hd163466_0624_rsrf_9.5.npz
